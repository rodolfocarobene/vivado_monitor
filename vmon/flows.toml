# All Vivado-specific knowledge for vmon lives here. Override or extend by creating
# ~/.config/vmon/flows.toml (tables are deep-merged, lists/scalars replaced).
# Every [x.<name>] table with an `order` is sorted by it, so you can add new entries
# (a step, a rule, a timing pattern, a report type) without touching Python.

[severity]            # log prefix -> severity key
"INFO" = "info"
"WARNING" = "warning"
"CRITICAL WARNING" = "critical"
"ERROR" = "error"

# ---------------------------------------------------------------- log line rules
# prefix: list of line prefixes (cheap pre-filter); first = string of allowed first chars;
# contains: substring pre-filter; stop=false lets later rules also see the line.
[rules.wallclock]
order = 5
action = "wallclock"
prefix = ["["]
re = '^\[(\w{3} \w{3} +\d+ [\d:]+ \d{4})\]'
stop = false

[rules.command]
order = 10
action = "command"
prefix = ["Command: "]
re = '^Command: (\S+)(.*)$'

[rules.command_failed_error]
order = 12
action = "command_failed"
prefix = ["ERROR: "]
contains = "Command failed"
re = '^ERROR: \[Common 17-69\] Command failed: .*'
stop = false

[rules.command_failed]
order = 13
action = "command_failed"
contains = " failed"
re = '^(\w+) failed\b'
stop = false

[rules.congestion_placer]
order = 28
action = "congestion_placer"
prefix = ["INFO: "]
contains = "Estimated Congestion"
re = '^INFO: \[\w+ [\d-]+\] Post-Placement Estimated Congestion'
stop = false

[rules.congestion_router]
order = 29
action = "congestion_router"
prefix = ["INFO: "]
contains = "Estimated Congestion"
re = '^INFO: \[\w+ [\d-]+\] Initial Estimated Congestion'
stop = false

[rules.message]
order = 30
action = "message"
prefix = ["INFO: ", "WARNING: ", "CRITICAL WARNING: ", "ERROR: "]
re = '^(INFO|WARNING|CRITICAL WARNING|ERROR): (?:\[([^\]]+)\] )?(.*)$'

[rules.phase]
order = 40
action = "phase"
prefix = ["Phase "]
re = '^Phase (\d+(?:\.\d+)*) (.+?)( \| Checksum: \w+)?\s*$'

[rules.task_close]
order = 41
action = "task_close"
prefix = ["Ending "]
re = '^Ending (.+?) Task\b'

[rules.task_open]
order = 42
action = "task_open"
prefix = ["Starting "]
re = '^Starting (.+?) Task\s*$'

[rules.start_timed]
order = 43
action = "start_timed"
prefix = ["Starting "]
re = '^Starting (.+?) : Time \(s\)'

[rules.pair_open]
order = 44
action = "pair_open"
prefix = ["Start "]
re = '^Start (.+?)\s*$'

[rules.pair_close]
order = 45
action = "pair_close"
prefix = ["Finished "]
re = '^Finished (.+?)( : Time \(s\).*)?\s*$'

[rules.overlaps]
order = 46
action = "overlaps"
prefix = [" Number of Nodes with overlaps"]
re = '^ Number of Nodes with overlaps = (\d+)'

[rules.time_line]
order = 50
action = "time_line"
prefix = ["Time (s)"]
re = '^Time \(s\)'

[rules.summary]
order = 60
action = "summary"
first = "0123456789"
contains = " Infos, "
re = '^(\d+) Infos, (\d+) Warnings, (\d+) Critical Warnings and (\d+) Errors encountered\.'

[rules.completed]
order = 61
action = "completed"
contains = " completed successfully"
re = '^(\w+) completed successfully'

[rules.named_time]
order = 62
action = "named_time"
contains = ": Time (s)"
re = '^([\w.]+): Time \(s\)'

[rules.congestion_row]
order = 70
action = "congestion_row"
prefix = ["|"]
re = '(?i)^\|\s*(North|South|East|West)\s*\|(.*)$'

[rules.congestion_final]
order = 71
action = "congestion_final"
prefix = ["North Dir ", "South Dir ", "East Dir ", "West Dir "]
contains = " Max Cong = "
re = '^(North|South|East|West) Dir (\d+x\d+) Area, Max Cong = ([\d.]+)%, (No Congested Regions)?'

[rules.congestion_direction]
order = 72
action = "congestion_direction"
prefix = ["Direction: "]
re = '^Direction: (North|South|East|West)\s*$'

[rules.congestion_effective]
order = 73
action = "congestion_effective"
prefix = ["Effective congestion level: "]
re = '^Effective congestion level: (\d+)'

[parse]
time_re = 'Time \(s\): cpu = (\S+) ; elapsed = (\S+) \. Memory \(MB\): peak = ([\d.]+)'
wallclock_format = "%a %b %d %H:%M:%S %Y"
tcl_start_step_re = '^start_step (\w+)'
open_project_re = 'open_project\s+(?:\{([^}]+)\}|"([^"]+)"|(\S+\.xpr))'
version_re = 'Vivado v(\d+\.\d+)'
max_messages = 300000

# ---------------------------------------------------------------- timing log patterns
# groups map positionally to `fields`; "N/A" -> null.
[timing.patterns.estimated]
order = 10
label = "Estimated"
contains = "Estimated Timing Summary"
re = 'Estimated Timing Summary \| WNS=(\S+) \| TNS=(\S+) \|'
fields = ["wns", "tns"]

[timing.patterns.post_placement]
order = 20
label = "Post Placement"
contains = "Post Placement Timing Summary"
re = 'Post Placement Timing Summary WNS=(-?[\d.]*\d|N/A)'
fields = ["wns"]

[timing.patterns.intermediate]
order = 30
label = "Intermediate"
contains = "Intermediate Timing Summary"
re = 'Intermediate Timing Summary \| WNS=(\S+)\s*\| TNS=(\S+)\s*\| WHS=(\S+)\s*\| THS=(\S+)\s*\|'
fields = ["wns", "tns", "whs", "ths"]

[timing.patterns.post_routing]
order = 40
label = "Post Routing"
contains = "Post Routing Timing Summary"
re = 'Post Routing Timing Summary \| WNS=(\S+)\s*\| TNS=(\S+)\s*\| WHS=(\S+)\s*\| THS=(\S+)\s*\|'
fields = ["wns", "tns", "whs", "ths"]

[timing.patterns.post_physopt]
order = 50
label = "Post Physical Optimization"
contains = "Post Physical Optimization Timing Summary"
re = 'Post Physical Optimization Timing Summary \| WNS=(\S+) \| TNS=(\S+) \|'
fields = ["wns", "tns"]

# ---------------------------------------------------------------- flow steps
# commands: Vivado commands that open this step (ambiguous commands are assigned in order).

[steps.synth_design]
order = 10
label = "Synthesis"
flow = "synth"
commands = ["synth_design"]

[steps.init_design]
order = 20
label = "Init Design"
flow = "impl"
commands = ["link_design"]

[steps.opt_design]
order = 30
label = "Opt Design"
flow = "impl"
commands = ["opt_design"]

[steps.power_opt_design]
order = 35
label = "Power Opt"
flow = "impl"
commands = ["power_opt_design"]

[steps.place_design]
order = 40
label = "Place Design"
flow = "impl"
commands = ["place_design"]

[steps.post_place_power_opt_design]
order = 45
label = "Post-Place Power Opt"
flow = "impl"
commands = ["power_opt_design"]

[steps.phys_opt_design]
order = 50
label = "Phys Opt Design"
flow = "impl"
commands = ["phys_opt_design"]

[steps.route_design]
order = 60
label = "Route Design"
flow = "impl"
commands = ["route_design"]

[steps.post_route_phys_opt_design]
order = 70
label = "Post-Route Phys Opt"
flow = "impl"
commands = ["phys_opt_design"]

[steps.write_bitstream]
order = 80
label = "Write Bitstream"
flow = "impl"
commands = ["write_bitstream", "write_device_image"]

# ---------------------------------------------------------------- run classification
[runs.classes.synth]
order = 10
pattern = '^synth_\d+$'
kind = "synth"

[runs.classes.ooc]
order = 20
pattern = '.+_synth_\d+$'
kind = "ooc"

[runs.classes.impl]
order = 30
pattern = '^impl_\d+$'
kind = "impl"

[runs.flow_ids]       # fallback when no pattern matches
Vivado_Synthesis = "synth"
Vivado_Implementation = "impl"

[runs]
queue_markers_glob = ".*.queue.rst"
synth_complete_file = "__synthesis_is_complete__"
jobs_dir = ".jobs"
jobs_glob = "vrs_config_*.xml"

[layout]
synth_stage_label = "Synthesis"
ooc_group_label = "IP out-of-context ({n})"
ooc_collapse_children_above = 8   # done OOC runs omit phase children beyond this count

# ---------------------------------------------------------------- reports registry
# pattern: regex on the filename with the "<top>_" prefix removed; parser: python parser name;
# label: short name shown in the UI; step: step that produced it ("*synth*" = the synthesis run node).
[reports.types.utilization_synth]
label = "Utilization"
order = 10
pattern = '^utilization_synth\.rpt$'
kind = "utilization"
parser = "utilization"
step = "synth_design"

[reports.types.utilization_placed]
label = "Utilization"
order = 11
pattern = '^utilization_placed\.rpt$'
kind = "utilization"
parser = "utilization"
step = "place_design"

[reports.types.utilization_routed]
label = "Utilization"
order = 12
pattern = '^utilization_routed\.rpt$'
kind = "utilization"
parser = "utilization"
step = "route_design"

[reports.types.control_sets]
label = "Control sets"
order = 20
pattern = '^control_sets_(placed|routed)\.rpt$'
kind = "control_sets"
parser = "control_sets"
step = "place_design"

[reports.types.io_placed]
label = "IO"
order = 21
pattern = '^io_placed\.rpt$'
kind = "io"
parser = "generic"
step = "place_design"

[reports.types.drc_opted]
label = "DRC"
order = 30
pattern = '^drc_opted\.rpt$'
kind = "drc"
parser = "drc"
step = "opt_design"

[reports.types.drc_routed]
label = "DRC"
order = 31
pattern = '^drc_routed\.rpt$'
kind = "drc"
parser = "drc"
step = "route_design"

[reports.types.methodology]
label = "Methodology"
order = 32
pattern = '^methodology_drc_routed\.rpt$'
kind = "methodology"
parser = "drc"
step = "route_design"

[reports.types.timing_placed]
label = "Timing"
order = 40
pattern = '^timing_summary_placed\.rpt$'
kind = "timing_summary"
parser = "timing"
step = "place_design"

[reports.types.timing_physopted]
label = "Timing"
order = 41
pattern = '^timing_summary_physopted\.rpt$'
kind = "timing_summary"
parser = "timing"
step = "phys_opt_design"

[reports.types.timing_routed]
label = "Timing"
order = 42
pattern = '^timing_summary_routed\.rpt$'
kind = "timing_summary"
parser = "timing"
step = "route_design"

[reports.types.timing_postroute]
label = "Timing"
order = 43
pattern = '^timing_summary_postroute_physopted\.rpt$'
kind = "timing_summary"
parser = "timing"
step = "post_route_phys_opt_design"

[reports.types.route_status]
label = "Route status"
order = 50
pattern = '^route_status\.rpt$'
kind = "route_status"
parser = "route_status"
step = "route_design"

[reports.types.power]
label = "Power"
order = 51
pattern = '^power_routed\.rpt$'
kind = "power"
parser = "power"
step = "route_design"

[reports.types.clock_utilization]
label = "Clocks"
order = 52
pattern = '^clock_utilization_routed\.rpt$'
kind = "clock_utilization"
parser = "clock_utilization"
step = "route_design"

[reports.types.bus_skew]
label = "Bus skew"
order = 53
pattern = '^bus_skew_routed\.rpt$'
kind = "bus_skew"
parser = "generic"
step = "route_design"

[reports.types.incremental_reuse]
label = "Incremental reuse"
order = 54
pattern = '^incremental_reuse_(routed|placed)\.rpt$'
kind = "incremental_reuse"
parser = "generic"
step = "route_design"

[reports.utilization]   # table row label regex -> short name
LUT = '^(CLB|Slice) LUTs'
FF = '^(CLB|Slice) Registers'
BRAM = '^Block RAM Tile'
URAM = '^URAM'
DSP = '^DSPs'
IO = '^Bonded IOB'
BUFG = '^(GLOBAL CLOCK BUFFERs|BUFGCE)$'

[reports.timing_columns]   # header text -> field
"WNS(ns)" = "wns"
"TNS(ns)" = "tns"
"TNS Failing Endpoints" = "tns_fail"
"TNS Total Endpoints" = "tns_total"
"WHS(ns)" = "whs"
"THS(ns)" = "ths"
"THS Failing Endpoints" = "ths_fail"
"THS Total Endpoints" = "ths_total"
"WPWS(ns)" = "wpws"
"TPWS(ns)" = "tpws"
"TPWS Failing Endpoints" = "tpws_fail"
"TPWS Total Endpoints" = "tpws_total"

# ---------------------------------------------------------------- alerts
[alerts]
stall_minutes = 20
utilization_pct = 90
timing_error_steps = ["route_design", "post_route_phys_opt_design", "write_bitstream"]   # timing is final once one of these is done
timing_final_steps = ["route_design", "post_route_phys_opt_design"]   # their timing_summary reports are final results

# ---------------------------------------------------------------- ETA
[eta]
history_builds = 20          # completed builds kept per firmware
low_quantile = 0.10          # band edges over the per-build remaining times
high_quantile = 0.90
quantile_min_builds = 3      # fewer builds: band is min/max widened by small_sample_margin
small_sample_margin = 0.15
current_floor = 0.10         # a running step/phase keeps at least this fraction of its typical duration
high_confidence_builds = 5   # builds needed (with every step known) for "high" confidence

# ---------------------------------------------------------------- build history (~/.cache/vmon/history/<fw_id>.json)
[history]
max_builds = 100      # finished builds kept per firmware (oldest dropped)
max_messages = 500    # warning-or-worse message ids stored per build (for the build comparison)
bitstream = true      # also record <top>.bit of the impl run (when this build wrote it)
kinds = ["timing_summary", "utilization", "drc", "methodology", "power", "route_status"]   # report kinds kept as artifacts; [] = all

# ---------------------------------------------------------------- timing paths (timing_summary reports)
[timing_paths]
max_paths = 200       # worst paths kept per report (half setup, half hold); the report is streamed, never loaded whole
summary_paths = 8     # how many of them go into the report summary inside the state JSON

# ---------------------------------------------------------------- router convergence
# Per iteration of the router (phases matching phase_re), the "Number of Nodes with overlaps" values and the
# Intermediate Timing Summary that follows. Trend over the last `window` iterations (final overlaps of each):
#   converging: the latest iteration ended with 0 overlaps, or overlaps keep dropping
#   diverging:  strictly increasing over the window
#   stalled:    still > 0 but down by less than min_improvement_pct over the window
[convergence]
phase_re = 'Global Iteration|Initial Net Routing|Initial Routing'
window = 3
min_improvement_pct = 20
alert = true                  # warning "route_not_converging" for live attempts
alert_min_iterations = 4      # ...once at least this many iterations were seen
max_iterations = 500
max_values = 64               # overlap values kept per iteration

# ---------------------------------------------------------------- congestion (place_design, route_design)
# Region sizes in the estimated-congestion tables map to a level = log2(size): 1x1 -> 0, 8x8 -> 3, 32x32 -> 5.
# Vivado: level >= 5 may impact timing closure. The step is "warn" from warn_level, "crit" from crit_level
# (both only colour the UI and raise the amber "congestion" alert, never an error).
[congestion]
warn_level = 5
crit_level = 7
alert = true                  # warning "congestion" when the worst level reaches warn_level
size_re = '^(\d+)x(\d+)$'
pct_re = '^\d+(?:\.\d+)?$'

# ---------------------------------------------------------------- failures, crashes and resumes
# Patterns are scanned in the tail of the run's runme.log / main log (and of a resume log). The first
# pattern by `order` that hits gives the reason; every hit line (max max_details) goes into the details.
# signal = true: group 1 is a signal number, named through [failure.signals].
[failure]
tail_bytes = 131072
max_details = 6
max_line_chars = 240
hs_err_glob = "hs_err_pid*.log"
hs_err_path_re = "Please check '([^']+hs_err_pid\\d+\\.log)'"
hs_err_head_lines = 40
hs_err_title_re = '^# (An unexpected error has occurred.*|A fatal error.*)'
hs_err_skip_frames = 'libc\.so|libpthread|linux-vdso'

[failure.signals]
"11" = "Segmentation fault"
"6" = "Aborted"
"7" = "Bus error"
"9" = "Killed"
"15" = "Terminated"

[failure.patterns.abnormal]
order = 10
re = 'Abnormal program termination \((\d+)\)'
signal = true
reason = "Abnormal termination (signal {1})"

[failure.patterns.segfault]
order = 20
re = '^segfault in '
reason = "Segmentation fault (signal 11)"

[failure.patterns.license_lost]
order = 30
re = 'Lost license|FlexNet Licensing error'
reason = "License lost"

[failure.patterns.out_of_memory]
order = 40
re = '(?i)ERROR: \[Common 17-\d+\] .*(out of memory|failed to allocate)|std::bad_alloc'
reason = "Out of memory"

[failure.patterns.killed]
order = 50
re = '^Killed\s*$'
reason = "Killed (signal 9)"

[failure.patterns.halted]
order = 60
re = '\*\*\* Halting run'
reason = "Run halted"

# Resume = a non-project Vivado session (open_checkpoint + route_design ...) that continues a run.
# The checkpoint file name suffix tells after which step it resumes (longest suffix wins).
[resume]
checkpoint_re = '^(?:# )?(?:Command: )?open_checkpoint\s+(?:\{([^}]+)\}|"([^"]+)"|(\S+))'
cd_re = '^# cd\s+(?:\{([^}]+)\}|"([^"]+)"|(\S+))'
session_start_re = 'Start of session at: (.+?)\s*$'
scan_bytes = 262144

[resume.checkpoints]
"_init" = "init_design"
"_opt" = "opt_design"
"_placed" = "place_design"
"_physopt" = "phys_opt_design"
"_routed" = "route_design"
"_postroute_physopt" = "post_route_phys_opt_design"

# Files that prove a step ran when no log/session explains them (a run that failed and was then finished
# outside vmon's sight: deleted resume script/log, other tools, ...). Only files in the run dir that are
# newer than the failure count. {top} = the run's top name (the .vdi stem). Checkpoints use [resume.checkpoints]
# and reports use [reports.types]; this table adds everything else (pattern on the file name -> step).
[artifacts]
tolerance_s = 1
[artifacts.files]
'^{top}\.bit$' = "write_bitstream"
'^{top}\.bin$' = "write_bitstream"
'^{top}_routed\.dcp$' = "route_design"

# ---------------------------------------------------------------- documentation links
# Templates only; edit freely in ~/.config/vmon/flows.toml. A value that is a bare Tcl command name is expanded
# with tcl_command; a value containing "://" is used as is. {query} is URL-encoded.
[docs]
tcl_command = "https://docs.amd.com/r/en-US/ug835-vivado-tcl-commands/{command}"   # UG835, one page per command
# docs.amd.com is a script-driven site without a stable search URL, so use a site-restricted web search.
message_search = "https://www.google.com/search?q=site%3Adocs.amd.com+%22{query}%22"

[docs.steps]          # step id -> page (UG904 Implementation, UG901 Synthesis, else UG835)
synth_design = "https://docs.amd.com/r/en-US/ug901-vivado-synthesis/Running-Synthesis"
init_design = "link_design"
opt_design = "https://docs.amd.com/r/en-US/ug904-vivado-implementation/opt_design"
power_opt_design = "https://docs.amd.com/r/en-US/ug904-vivado-implementation/power_opt_design"
place_design = "https://docs.amd.com/r/en-US/ug904-vivado-implementation/place_design-for-UltraScale-and-7-Series"
post_place_power_opt_design = "https://docs.amd.com/r/en-US/ug904-vivado-implementation/power_opt_design"
phys_opt_design = "https://docs.amd.com/r/en-US/ug904-vivado-implementation/phys_opt_design"
route_design = "https://docs.amd.com/r/en-US/ug904-vivado-implementation/route_design"
post_route_phys_opt_design = "https://docs.amd.com/r/en-US/ug904-vivado-implementation/phys_opt_design"
write_bitstream = "write_bitstream"

[docs.reports]        # report kind -> Tcl command (UG835 page)
utilization = "report_utilization"
control_sets = "report_control_sets"
io = "report_io"
drc = "report_drc"
methodology = "report_methodology"
timing_summary = "report_timing_summary"
route_status = "report_route_status"
power = "report_power"
clock_utilization = "report_clock_utilization"
bus_skew = "report_bus_skew"
incremental_reuse = "report_incremental_reuse"

# ---------------------------------------------------------------- UI
[ui]
headline_resources = ["LUT", "FF", "BRAM", "URAM", "DSP", "IO", "BUFG"]

# ---------------------------------------------------------------- message triage
# First matching rule wins (id regex is searched in "Tool N-M"; optional severity = list of severities).
# priority: critical|high|medium|low|mute.
# score = severity_base + priority_bonus + keyword bonuses (capped) + rarity + novelty.
[messages.scoring]
severity_base = { error = 100, critical = 40, warning = 10, info = 0 }
priority_bonus = { critical = 90, high = 55, medium = 25, low = -15, mute = 0 }
keyword_cap = 30
rarity = { once = 15, few = 8, few_max = 5, many_min = 100, many_penalty = -10, huge_min = 1000, huge_penalty = -20 }
novelty = { new = 30, grew = 5 }

[[messages.keywords]]
pattern = 'latch'
bonus = 15
reason = "latch"

[[messages.keywords]]
pattern = 'multi-?driven'
bonus = 15
reason = "multi-driven"

[[messages.keywords]]
pattern = 'undriven'
bonus = 12
reason = "undriven"

[[messages.keywords]]
pattern = 'unconnected'
bonus = 2
reason = "unconnected"

[[messages.keywords]]
pattern = 'no clock'
bonus = 10
reason = "no clock"

[[messages.keywords]]
pattern = 'unconstrained'
bonus = 12
reason = "unconstrained"

[[messages.keywords]]
pattern = 'not found'
bonus = 8
reason = "not found"

[[messages.keywords]]
pattern = 'ignor'
bonus = 8
reason = "ignored"

[[messages.keywords]]
pattern = '(no|zero) (cells|pins|nets|objects|clocks|ports) (matched|found)'
bonus = 12
reason = "nothing matched"

[[messages.keywords]]
pattern = 'overrid'
bonus = 6
reason = "override"

[[messages.keywords]]
pattern = 'mismatch'
bonus = 8
reason = "mismatch"

[[messages.keywords]]
pattern = 'truncat'
bonus = 8
reason = "truncated"

[[messages.keywords]]
pattern = '\bCDC\b'
bonus = 8
reason = "CDC"

[[messages.keywords]]
pattern = 'failed'
bonus = 10
reason = "failed"

[[messages.keywords]]
pattern = 'unsafe'
bonus = 10
reason = "unsafe"

[[messages.keywords]]
pattern = 'combinational loop'
bonus = 15
reason = "combinational loop"

[[messages.rules]]
match_id = '^Timing 38-282$'
priority = "critical"
reason = "design failed to meet timing"

[[messages.rules]]
match_id = '^Route 35-39$'
priority = "critical"
reason = "routed design did not meet timing"

[[messages.rules]]
match_id = '^Route 35-328$'
priority = "critical"
reason = "router could not meet timing / unrouted"

[[messages.rules]]
match_id = '^Synth 8-6859$'
priority = "critical"
reason = "multi-driven net"

[[messages.rules]]
match_id = '^Synth 8-3352$'
priority = "critical"
reason = "multi-driven net"

[[messages.rules]]
match_id = '^Synth 8-327$'
priority = "high"
reason = "latch inferred"

[[messages.rules]]
match_id = '^Vivado 12-180$'
priority = "high"
reason = "no cells matched: constraint not applied"

[[messages.rules]]
match_id = '^Vivado 12-508$'
priority = "high"
reason = "no pins matched: constraint not applied"

[[messages.rules]]
match_id = '^Vivado 12-1387$'
priority = "high"
reason = "no ports/nets matched: constraint not applied"

[[messages.rules]]
match_id = '^Vivado 12-4739$'
priority = "high"
reason = "clock/cell not found: constraint not applied"

[[messages.rules]]
match_id = '^Vivado 12-584$'
priority = "high"
reason = "no clocks matched: constraint not applied"

[[messages.rules]]
match_id = '^Common 17-55$'
priority = "high"
reason = "get_* returned an empty object"

